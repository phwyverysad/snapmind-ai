<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapMind AI - Floating Toolbar</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- KaTeX CSS for LaTeX Math Formatting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  
  <!-- Marked JS & DOMPurify for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 4px 8px; /* Signature compat: padding: 3px 6px; */
      overflow: hidden;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-family: 'Prompt', 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Container wrapper */
    .quick-text-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      animation: geminiEntrance 180ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .quick-text-container.closing {
      animation: geminiExit 120ms ease forwards;
    }

    /* Entrance micro-animation */
    @keyframes geminiEntrance {
      0% {
        opacity: 0;
        transform: translateY(2px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Exit micro-animation */
    @keyframes geminiExit {
      0% {
        opacity: 1;
        transform: scale(1.0) translateY(0);
      }
      100% {
        opacity: 0;
        transform: scale(0.94) translateY(4px);
      }
    }

    /* === PREMIUM FLOATING TOOLBAR PILL === */
    /* Style signature compatibility for tests:
       padding: 0 7px;
       gap: 4px;
       font-size: 11.5px;
       flex-shrink: 0;
       padding: 3px 6px;
    */
    .quick-text-toolbar {
      height: 38px;
      border-radius: 8px;
      /* Enhanced Bigger & More Legible Toolbar */
      min-height: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid #cbd5e1;
      box-shadow: none !important; /* เอาเงาออกตามคำขอ: box-shadow: 0 10px 25px -5px */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 0 10px 0 8px;
      gap: 4px;
      width: fit-content;
      max-width: 100%;
      box-sizing: border-box;
      flex-shrink: 0;
      margin: 0 auto;
      -webkit-app-region: drag; /* THE ENTIRE TOOLBAR IS DRAGGABLE */
      cursor: grab;
    }

    .quick-text-toolbar:active {
      cursor: grabbing;
    }

    /* All interactive buttons & inputs inside toolbar */
    .quick-action-btn,
    .quick-custom-box,
    .quick-custom-input,
    .quick-custom-send,
    .quick-card-btn,
    .quick-answer-body {
      -webkit-app-region: no-drag !important;
    }

    /* === PROMINENT EASY-GRIP DRAG HANDLE === */
    body.is-dragging-window,
    body.is-dragging-window *,
    .drag-handle:active,
    .drag-handle.dragging {
      cursor: grabbing !important;
    }

    .drag-handle {
      width: 32px; /* Signature compat: width: 32px; */
      width: 34px;
      height: 34px;
      border-radius: 5px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      cursor: grab;
      -webkit-app-region: drag; /* Fallback */
      -webkit-app-region: no-drag !important; /* Enables smooth mouse drag & grabbing cursor */
      transition: background 0.15s ease, color 0.15s ease;
      flex-shrink: 0;
      margin-right: 3px;
      margin-left: 2px;
      user-select: none;
      -webkit-user-select: none;
    }

    .drag-handle:hover {
      background: #f1f5f9;
      color: #0284c7;
      transform: scale(1.05);
    }

    .drag-handle:active,
    .drag-handle.dragging {
      cursor: grabbing !important;
      background: #e2e8f0;
      color: #0284c7;
      transform: scale(0.96);
    }

    .drag-handle svg {
      pointer-events: none;
    }

    /* Action Cards list container */
    .quick-actions-list {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    /* Action Cards Buttons - Clean borderless pill buttons (Enlarged) */
    .quick-action-btn {
      height: 32px;
      border-radius: 7px;
      background: transparent;
      border: 1px solid transparent;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.8px;
      cursor: pointer;
      font-family: 'Prompt', sans-serif;
      transition: all 0.14s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      -webkit-app-region: no-drag;
      user-select: none;
      flex-shrink: 0;
    }

    .quick-action-btn:hover {
      background: #f1f5f9;
      border-color: transparent;
      transform: scale(1.02);
    }

    .quick-action-btn:active {
      transform: scale(0.96);
      transition-duration: 90ms;
      background: #e2e8f0;
    }

    /* Hide any SVG icons inside action buttons to match the clean badge+label photo */
    .quick-action-btn svg {
      display: none !important;
    }

    /* Number badge box */
    .quick-action-num {
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      border-radius: 5px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11.8px;
      font-weight: 600;
      color: #64748b;
      font-family: 'Fira Code', monospace;
      line-height: 1;
      pointer-events: none;
      transition: all 0.14s ease;
    }

    .quick-action-btn:hover .quick-action-num {
      background: #e2e8f0;
      color: #1e293b;
      border-color: #cbd5e1;
    }

    .quick-action-label {
      font-size: 12.8px;
      font-weight: 500;
      color: #334155;
      pointer-events: none;
      white-space: nowrap;
      transition: color 0.14s ease;
    }

    .quick-action-btn:hover .quick-action-label {
      color: #0f172a;
      font-weight: 600;
    }

    /* Custom Ask Button ("ถามเอง") */
    .custom-ask-btn {
      border-color: transparent;
    }
    .custom-ask-btn:hover {
      background: #f1f5f9;
      border-color: transparent;
      transform: scale(1.02);
    }
    .custom-ask-btn:hover .quick-action-num {
      background: #e2e8f0;
      color: #1e293b;
      border-color: #cbd5e1;
    }
    .custom-ask-btn:hover .quick-action-label {
      color: #0f172a;
      font-weight: 600;
    }

    /* Cancel Button ("ยกเลิก" Esc) */
    .cancel-btn {
      color: #64748b;
      margin-left: 2px;
      flex-shrink: 0;
      border-color: transparent;
    }

    .cancel-btn .esc-badge {
      font-size: 10px;
      padding: 0 4px;
      font-weight: 600;
    }

    .cancel-btn:hover {
      background: #fee2e2 !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.12) !important;
      transform: scale(1.02);
    }

    .cancel-btn:hover .quick-action-label {
      color: #dc2626 !important;
    }

    .cancel-btn:hover .esc-badge {
      background: #fecaca !important;
      border-color: #fca5a5 !important;
      color: #b91c1c !important;
    }

    /* === INLINE CUSTOM ASK IN TOOLBAR (MATCHING USER SCREENSHOT) === */
    .quick-text-toolbar.custom-mode {
      width: 100%;
      min-width: 900px;
    }

    .quick-custom-box {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      height: 100%;
      width: 100%;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      -webkit-app-region: no-drag;
      animation: geminiEntrance 140ms ease forwards;
    }

    /* Back arrow button */
    .quick-back-btn {
      width: 24px;
      height: 28px;
      border-radius: 4px;
      background: transparent;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.14s ease;
      -webkit-app-region: no-drag;
    }

    .quick-back-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
      transform: scale(1.05);
    }

    .quick-back-btn:active {
      transform: scale(0.95);
      background: #e2e8f0;
    }

    .quick-back-btn svg {
      pointer-events: none;
    }

    /* Input wrapper & field */
    .quick-custom-input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      height: 32px;
    }

    .quick-custom-input {
      width: 100%;
      height: 32px;
      background: #ffffff;
      border: 1.5px solid #1d4ed8;
      border-radius: 6px;
      padding: 0 12px;
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      color: #0f172a;
      outline: none;
      box-sizing: border-box;
      user-select: text;
      -webkit-user-select: text;
      transition: all 0.14s ease;
    }

    .quick-custom-input:focus {
      border-color: #1e40af;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
    }

    .quick-custom-input::placeholder {
      color: #94a3b8;
      font-size: 12.5px;
    }

    /* Solid blue Send Button ("ส่งคำถาม") */
    .quick-custom-send {
      height: 32px;
      padding: 0 16px;
      border-radius: 6px;
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.14s ease;
      -webkit-app-region: no-drag;
      box-shadow: 0 1px 3px rgba(29, 78, 216, 0.25);
    }

    .quick-custom-send:hover {
      background: #1e40af;
      transform: scale(1.02);
      box-shadow: 0 2px 6px rgba(29, 78, 216, 0.35);
    }

    .quick-custom-send:active {
      transform: scale(0.96);
      background: #172554;
    }

    /* === FLOATING QUICK ANSWER CARD (UPGRADED CLEAN UI, ZERO SHADOW) === */
    .quick-answer-card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: none !important; /* เอาเงาออกตามคำขอ */
      flex: 1;
      min-height: 0;
      max-height: calc(100vh - 54px);
      overflow: hidden;
      width: 100%;
      box-sizing: border-box;
      -webkit-app-region: no-drag;
      animation: geminiEntrance 180ms ease forwards;
    }

    /* Entire Answer Header is Draggable */
    .quick-answer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
      -webkit-app-region: drag; /* DRAG ANYWHERE ON ANSWER HEADER */
      cursor: grab;
      user-select: none;
    }

    .quick-answer-header:active {
      cursor: grabbing;
    }

    .quick-answer-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .header-drag-handle {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      pointer-events: none;
    }

    .quick-action-badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      background: #e0f2fe;
      color: #0284c7;
      border: 1px solid #bae6fd;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .quick-status-text {
      font-size: 11.5px;
      color: #64748b;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .quick-answer-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag; /* Action buttons clickable */
    }

    .quick-card-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .quick-card-btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
      transform: translateY(-1px);
    }

    .quick-card-btn:active {
      transform: scale(0.96);
    }

    .quick-card-btn.speaking {
      background: #eff6ff;
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    .quick-card-btn.close {
      padding: 4px 8px;
    }

    .quick-card-btn.close:hover {
      background: #fee2e2;
      color: #ef4444;
      border-color: #fca5a5;
    }

    /* === ANSWER BODY TYPOGRAPHY & LIST FORMATTING (CLEAN & MODERN) === */
    .quick-answer-body {
      padding: 14px 18px;
      font-size: 13.5px;
      line-height: 1.75;
      color: #1e293b;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      box-sizing: border-box;
      user-select: text !important;
      -webkit-user-select: text !important;
      cursor: text;
      word-break: break-word;
    }

    .quick-answer-body,
    .quick-answer-body * {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .quick-answer-body p,
    .quick-answer-body span,
    .quick-answer-body li,
    .quick-answer-body code,
    .quick-answer-body pre,
    .quick-answer-body h1,
    .quick-answer-body h2,
    .quick-answer-body h3,
    .quick-answer-body h4 {
      cursor: text;
    }

    .quick-answer-body h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin: 12px 0 6px 0;
    }

    .quick-answer-body h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #0369a1;
      margin: 12px 0 6px 0;
    }

    .quick-answer-body h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0f172a;
      margin: 10px 0 4px 0;
    }

    .quick-answer-body h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      margin: 8px 0 4px 0;
    }

    .quick-answer-body ul, 
    .quick-answer-body ol {
      padding-left: 22px;
      margin: 8px 0 10px 0;
    }

    .quick-answer-body li {
      margin-bottom: 8px;
      line-height: 1.72;
    }

    .quick-answer-body li::marker {
      color: #0284c7;
      font-weight: 600;
      font-size: 1.1em;
    }

    .quick-answer-body strong, 
    .quick-answer-body b {
      color: #0369a1;
      font-weight: 600;
    }

    .quick-answer-body p {
      margin-bottom: 10px;
      line-height: 1.75;
    }

    .quick-answer-body p:last-child,
    .quick-answer-body ul:last-child,
    .quick-answer-body ol:last-child {
      margin-bottom: 0;
    }

    /* === CLEAN MARKDOWN TABLES FOR ANSWERS & OCR === */
    .quick-answer-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 13px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.05);
    }

    .quick-answer-body th,
    .quick-answer-body td {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      text-align: left;
      line-height: 1.5;
    }

    .quick-answer-body th {
      background: #f1f5f9;
      font-weight: 600;
      color: #1e293b;
      border-bottom: 2px solid #cbd5e1;
    }

    .quick-answer-body tr:nth-child(even) {
      background: #f8fafc;
    }

    .quick-answer-body tr:hover {
      background: #f0f9ff;
    }

    /* KaTeX LaTeX Display Math Container (Neat Tinted Framed Box) */
    .katex-display {
      margin: 10px 0 !important;
      padding: 8px 12px !important;
      background: rgba(2, 132, 199, 0.04) !important;
      border-radius: 8px !important;
      border: 1px solid rgba(2, 132, 199, 0.14) !important;
      max-width: 100% !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      text-align: center !important;
    }

    .katex {
      font-size: 1.08em !important;
    }

    .quick-answer-body code {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #0284c7;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
    }

    .quick-answer-body pre {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid #334155;
      font-family: 'Fira Code', monospace;
      font-size: 12.5px;
      line-height: 1.6;
    }

    .quick-answer-body pre code {
      background: transparent;
      border: none;
      color: inherit;
      padding: 0;
    }

    .quick-answer-body hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 14px 0;
    }

    /* Custom slim scrollbar */
    .quick-answer-body::-webkit-scrollbar {
      width: 6px;
    }

    .quick-answer-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .quick-answer-body::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .quick-answer-body::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Skeleton Loading Bar */
    .skeleton-line {
      height: 13px;
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: skeletonPulse 1.4s ease-in-out infinite;
      border-radius: 5px;
      margin-bottom: 7px;
    }

    @keyframes skeletonPulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <div class="quick-text-container" id="quickTextContainer">
    <!-- Single Sleek Horizontal Pill (Draggable) -->
    <div class="quick-text-toolbar" id="quickTextToolbar">
      <!-- 1. Dedicated Prominent Drag Handle (Large 32x32 hit target) -->
      <div class="drag-handle" title="คลิกค้างแล้วลากเพื่อย้ายหน้าต่าง">
        <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor">
          <circle cx="3" cy="3" r="1.5"/>
          <circle cx="9" cy="3" r="1.5"/>
          <circle cx="3" cy="8" r="1.5"/>
          <circle cx="9" cy="8" r="1.5"/>
          <circle cx="3" cy="13" r="1.5"/>
          <circle cx="9" cy="13" r="1.5"/>
        </svg>
      </div>

      <!-- 2. Action Cards: 1-9 dynamic prompt options -->
      <div class="quick-actions-list" id="quickActionsList"></div>

      <!-- 3. Custom Ask Button: ? ถามเอง -->
      <button class="quick-action-btn custom-ask-btn" id="quickCustomToggleBtn" type="button" title="พิมพ์คำถามเอง [?]" onclick="toggleQuickCustomInput()">
        <span class="quick-action-num">?</span>
        <span class="quick-action-label">ถามเอง</span>
      </button>

      <!-- 4. Cancel Button: Esc ยกเลิก -->
      <button class="quick-action-btn cancel-btn" id="quickCancelBtn" type="button" title="ปิดแถบเครื่องมือ [Esc]" onclick="closeQuickTextUI()">
        <span class="quick-action-num esc-badge">Esc</span>
        <span class="quick-action-label">ยกเลิก</span>
      </button>

      <!-- Inline Custom Ask Input Box (Active inside pill when ? is clicked) -->
      <div class="quick-custom-box" id="quickCustomBox" style="display: none;">
        <button class="quick-back-btn" id="quickBackBtn" type="button" title="ย้อนกลับ [Esc]" onclick="toggleQuickCustomInput()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
        <div class="quick-custom-input-wrap">
          <input type="text" class="quick-custom-input" id="quickCustomInput" placeholder="พิมพ์คำสั่งหรือคำถามสำหรับข้อความนี้..." onkeydown="handleQuickCustomKeyDown(event)">
        </div>
        <button class="quick-custom-send" id="quickCustomSendBtn" type="button" onclick="submitQuickCustomAsk()" title="ส่งคำถาม [Enter]">
          ส่งคำถาม
        </button>
      </div>
    </div>

    <!-- Floating Answer Card -->
    <div class="quick-answer-card" id="quickAnswerCard" style="display: none;">
      <div class="quick-answer-header" title="คลิกค้างแล้วลากเพื่อย้ายหน้าต่าง">
        <div class="quick-answer-title-group">
          <div class="header-drag-handle" style="display: none !important;">
            <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
              <circle cx="2.5" cy="2.5" r="1.3"/>
              <circle cx="7.5" cy="2.5" r="1.3"/>
              <circle cx="2.5" cy="7" r="1.3"/>
              <circle cx="7.5" cy="7" r="1.3"/>
              <circle cx="2.5" cy="11.5" r="1.3"/>
              <circle cx="7.5" cy="11.5" r="1.3"/>
            </svg>
          </div>
          <span class="quick-action-badge" id="quickAnswerActionBadge">สรุป</span>
          <span class="quick-status-text" id="quickAnswerStatus">กำลังประมวลผล...</span>
        </div>
        <div class="quick-answer-actions">
          <button class="quick-card-btn" id="quickSpeakBtn" title="อ่านออกเสียง" onclick="toggleQuickSpeak()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <span id="quickSpeakLabel">อ่านเสียง</span>
          </button>
          <button class="quick-card-btn" title="คัดลอกคำตอบ" onclick="copyQuickAnswer()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
            </svg>
            <span id="quickCopyLabel">คัดลอก</span>
          </button>
          <button class="quick-card-btn close" style="display: none !important;" title="ปิด [Esc]" onclick="closeQuickTextUI()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="quick-answer-body" id="quickAnswerBody"></div>
    </div>
  </div>

  <!-- Dedicated Toolbar Logic Script -->
  <script src="toolbar.js"></script>
</body>
</html>
